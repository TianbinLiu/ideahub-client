# IdeaHub 前端安全响应头（nginx）
#
# ★ 为什么这份文件存在：站点由 ECS 上的 nginx 提供服务（/var/www/ideahub-client-dist），
#   不是 Vercel。仓库里的 vercel.json 对生产【不生效】—— 真正决定响应头的是这里。
#
# 用法（在 ECS 上，deploy 用户）：
#   1. 上传本文件到 /etc/nginx/snippets/ideahub-security-headers.conf
#   2. 在 /etc/nginx/sites-available/ideahub 的 ideahubs.org server 块里加一行：
#          include /etc/nginx/snippets/ideahub-security-headers.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. 验证：curl -I https://ideahubs.org  应能看到下面这些头
#
# ★ nginx 的 add_header 有个坑：一旦子块（location）里出现任何 add_header，
#   父块继承来的全部 add_header 会被【整体丢弃】。所以下面每个 location 块里
#   都重新 include 了这份文件，不要图省事删掉。

# ── CSP ────────────────────────────────────────────────────────────
# 这份策略已在浏览器里实测过：内联脚本与外域脚本被拦截，
# Live2D 的 cubism CDN 脚本、tesseract 的 blob worker 正常工作，无误伤。
#
# 两处妥协需知悉：
#   - style-src 'unsafe-inline'：Tailwind + workshopTheme.ts 动态注入 <style>
#     与大量内联 style 属性的现实要求，短期去不掉。
#   - frame-src https:：创意详情页要内嵌任意第三方站点。若日后把内嵌改成
#     域名白名单，这条应同步收紧。
# 自托管 cubism core 后，可从 script-src/connect-src 里删掉那两个外域。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' blob: https://cubism.live2d.com https://fastly.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' blob: data: https://api.ideahubs.org https://res.cloudinary.com https://cubism.live2d.com https://fastly.jsdelivr.net https://v1.hitokoto.cn; worker-src 'self' blob:; frame-src https:; upgrade-insecure-requests" always;

# ── 传输安全 ────────────────────────────────────────────────────────
# ★ 先用较短 max-age 上线观察，确认全站 HTTPS 无遗漏后再加到 63072000 并申请 preload。
#   preload 一旦提交到浏览器列表就【很难撤销】，回退周期以月计。
add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;

# ── 常规硬化 ────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-DNS-Prefetch-Control "off" always;
